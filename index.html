<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-96.png" sizes="96x96" type="image/png">
  <title>LiveCoach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Rajdhani', 'Courier New', monospace;
      font-size: 16px;
      user-select: none;
    }

    /* ── Grid background ────────────────────────────────── */
    #app {
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image:
        linear-gradient(rgba(0,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Top bar ────────────────────────────────────────── */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
      position: relative;
    }

    #gps-dot {
      font-size: 12px;
      letter-spacing: 2px;
      color: #333;
      font-weight: 600;
    }
    #gps-dot.locked { color: #0f0; text-shadow: 0 0 8px #0f0; }

    #mode-bar {
      display: flex;
      gap: 32px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .mode-tab {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #2a2a2a;
      transition: color 0.2s;
    }

    .mode-tab.active {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent);
    }

    #clock {
      font-size: 13px;
      letter-spacing: 2px;
      color: #333;
      font-weight: 600;
    }

    /* ── Screens ────────────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 10px 20px 0;
      overflow: hidden;
      --accent: #0ff;
    }

    .screen.active { display: flex; }

    #screen-run  { --accent: #0ff; }
    #screen-ride { --accent: #f90; }
    #screen-gym  { --accent: #c084fc; }

    /* ── Side-by-side row (Run + Ride) ──────────────────── */
    .main-row {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    /* ── GPS Trail canvas ───────────────────────────────── */
    .trail-canvas {
      width: 272px;
      height: 100%;
      flex-shrink: 0;
      display: block;
      border: 1px solid rgba(255,255,255,0.06);
      background: #000;
      position: relative;
    }

    /* ── Hero panel (right side) ────────────────────────── */
    .hero-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* HUD corner brackets */
    .hero-panel::before,
    .hero-panel::after,
    .trail-canvas-wrap::before,
    .trail-canvas-wrap::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.4;
      pointer-events: none;
    }

    .hero-panel::before { top: 0;  left: 0;  border-width: 1px 0 0 1px; }
    .hero-panel::after  { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    .hero-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 5px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .hero-value {
      font-size: 80px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 30px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 25%, transparent);
      letter-spacing: -2px;
      text-align: center;
    }

    .hero-unit {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #444;
      margin-top: 4px;
    }

    /* ── Gym hero (centered, larger) ────────────────────── */
    .hero-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero-wrap .hero-value { font-size: 120px; }

    .hero-wrap::before,
    .hero-wrap::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.4;
    }
    .hero-wrap::before { top: 0;  left: 0;  border-width: 1px 0 0 1px; }
    .hero-wrap::after  { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    /* ── Stat strip ─────────────────────────────────────── */
    .stat-strip {
      display: flex;
      gap: 6px;
      padding: 8px 0 6px;
      flex-shrink: 0;
    }

    .stat-cell {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #444;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .stat-cell.hr .stat-value { color: #555; }
    .stat-cell.hr .stat-label { color: #2a2a2a; }

    /* ── Interval banner ────────────────────────────────── */
    #interval-banner {
      display: none;
      background: #0f0;
      color: #000;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 4px 0;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    /* ── Controls ───────────────────────────────────────── */
    .ctrl-row {
      display: flex;
      gap: 8px;
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .focusable {
      min-height: 88px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #333;
      background: rgba(255,255,255,0.02);
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
    }

    .focusable.focused {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 20%, transparent),
                  inset 0 0 16px color-mix(in srgb, var(--accent) 5%, transparent);
    }

    /* ── Session summary overlay ────────────────────────── */
    #summary-overlay {
      display: none;
      position: absolute;
      top: 44px;
      bottom: 28px;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.97);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      z-index: 10;
      --accent: #0ff;
    }

    #summary-overlay.visible { display: flex; }

    .sum-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #555;
      margin-bottom: 8px;
    }

    .sum-tag::after {
      content: '';
      display: block;
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      margin: 8px auto 0;
    }

    .sum-hero {
      font-size: 100px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px var(--accent), 0 0 80px color-mix(in srgb, var(--accent) 25%, transparent);
      letter-spacing: -2px;
    }

    .sum-unit {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #444;
      margin-bottom: 16px;
      margin-top: 4px;
    }

    .sum-grid {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 14px;
    }

    .sum-cell {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sum-val {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .sum-lbl {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #444;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Status bar ─────────────────────────────────────── */
    #status-bar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
      font-weight: 600;
      color: #252525;
      letter-spacing: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="app">

  <div id="top-bar">
    <span id="gps-dot">GPS --</span>
    <div id="mode-bar">
      <span class="mode-tab" data-mode="run">RUN</span>
      <span class="mode-tab" data-mode="ride">RIDE</span>
      <span class="mode-tab" data-mode="gym">GYM</span>
    </div>
    <span id="clock">--:--</span>
  </div>

  <!-- ── RUN ──────────────────────────────────────────── -->
  <div class="screen" id="screen-run">

    <div class="main-row">
      <canvas id="run-canvas" class="trail-canvas"></canvas>
      <div class="hero-panel">
        <div class="hero-label">PACE</div>
        <div class="hero-value" id="run-pace">--:--</div>
        <div class="hero-unit">/ MILE</div>
      </div>
    </div>

    <div id="interval-banner">INTERVAL &nbsp; 0:00</div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="run-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="run-time">0:00</div>
        <div class="stat-label">TIME</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-run">START RUN</button>
    </div>
    <div class="ctrl-row">
      <button class="focusable" id="btn-interval">INTERVAL 1:00</button>
    </div>

  </div>

  <!-- ── RIDE ─────────────────────────────────────────── -->
  <div class="screen" id="screen-ride">

    <div class="main-row">
      <canvas id="ride-canvas" class="trail-canvas"></canvas>
      <div class="hero-panel">
        <div class="hero-label">SPEED</div>
        <div class="hero-value" id="ride-speed">0.0</div>
        <div class="hero-unit">MPH</div>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="ride-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="ride-elev">+0</div>
        <div class="stat-label">FT ELEV</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-ride">START RIDE</button>
    </div>

  </div>

  <!-- ── GYM ──────────────────────────────────────────── -->
  <div class="screen" id="screen-gym">

    <div class="hero-wrap">
      <div class="hero-label">SET TIMER</div>
      <div class="hero-value" id="gym-timer">0:00</div>
      <div class="hero-unit">&nbsp;</div>
    </div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="gym-reps">0</div>
        <div class="stat-label">REPS</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="gym-sets">0</div>
        <div class="stat-label">SETS</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-rep">+ REP</button>
      <button class="focusable" id="btn-end-set">END SET</button>
    </div>
    <div class="ctrl-row">
      <button class="focusable" id="btn-rest">REST 1:30</button>
    </div>

  </div>

  <!-- Session summary overlay -->
  <div id="summary-overlay">
    <div class="sum-tag">SESSION COMPLETE</div>
    <div class="sum-hero" id="sum-hero">0.00</div>
    <div class="sum-unit" id="sum-unit">MILES</div>
    <div class="sum-grid" id="sum-grid"></div>
    <button class="focusable" id="btn-sum-close">CLOSE</button>
  </div>

  <div id="status-bar">
    <span>← → MODE</span>
    <span>LIVECOACH</span>
    <span>↑ ↓ ENTER</span>
  </div>

</div>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  mode: 'run',
  modes: ['run', 'ride', 'gym'],

  gpsId: null,
  lastCoord: null,
  baseAltitude: null,

  runActive: false,
  runStart: 0,
  runDist: 0,
  runTrail: [],        // [{lat, lng}]
  runTickId: null,
  intervalActive: false,
  intervalSec: 60,
  intervalRemain: 0,
  intervalTickId: null,

  summaryVisible: false,

  rideActive: false,
  rideStart: 0,
  rideDist: 0,
  rideTrail: [],

  gymSetActive: false,
  gymSetStart: 0,
  gymSetTickId: null,
  gymReps: 0,
  gymSets: 0,
  gymRestTickId: null,
  gymRestRemain: 0,

  focusIdx: 0,
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function fmtSec(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function haversine(la1, lo1, la2, lo2) {
  const R = 3958.8, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─── Session summary ─────────────────────────────────────────────────────────
function showSummary(accent, heroVal, heroUnit, stats, saveKey, saveData) {
  S.summaryVisible = true;
  const overlay = $('summary-overlay');
  overlay.style.setProperty('--accent', accent);
  $('sum-hero').textContent = heroVal;
  $('sum-unit').textContent = heroUnit;
  $('sum-grid').innerHTML = stats.map(([val, lbl]) =>
    `<div class="sum-cell"><div class="sum-val">${val}</div><div class="sum-lbl">${lbl}</div></div>`
  ).join('');
  overlay.classList.add('visible');
  $('btn-sum-close').classList.add('focused');
  try { localStorage.setItem(saveKey, JSON.stringify({ date: new Date().toISOString(), ...saveData })); } catch(e) {}
}

function closeSummary() {
  S.summaryVisible = false;
  $('summary-overlay').classList.remove('visible');
  $('btn-sum-close').classList.remove('focused');
  refreshFocus();
}

$('btn-sum-close').addEventListener('click', closeSummary);

// ─── Trail canvas ─────────────────────────────────────────────────────────────
function sizeCanvas(canvas) {
  canvas.width  = canvas.offsetWidth  || 272;
  canvas.height = canvas.offsetHeight || 200;
}

function drawTrail(canvasId, trail, accent) {
  const canvas = $(canvasId);
  if (!canvas) return;
  if (!canvas.width || canvas.width !== canvas.offsetWidth) sizeCanvas(canvas);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Faint grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (trail.length < 2) {
    ctx.fillStyle = '#1e1e1e';
    ctx.font = `700 11px Rajdhani, monospace`;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '3px';
    ctx.fillText('WAITING FOR GPS', W / 2, H / 2 - 6);
    ctx.fillText('START TO RECORD', W / 2, H / 2 + 10);
    return;
  }

  // Bounding box with padding
  let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
  for (const p of trail) {
    if (p.lat < minLat) minLat = p.lat;
    if (p.lat > maxLat) maxLat = p.lat;
    if (p.lng < minLng) minLng = p.lng;
    if (p.lng > maxLng) maxLng = p.lng;
  }

  const pad = 0.18;
  const dLat = (maxLat - minLat) || 0.0005;
  const dLng = (maxLng - minLng) || 0.0005;
  minLat -= dLat * pad; maxLat += dLat * pad;
  minLng -= dLng * pad; maxLng += dLng * pad;

  function toXY(lat, lng) {
    return [
      ((lng - minLng) / (maxLng - minLng)) * (W - 16) + 8,
      (1 - (lat - minLat) / (maxLat - minLat)) * (H - 16) + 8,
    ];
  }

  // Trail line
  ctx.shadowColor = accent;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  const [sx, sy] = toXY(trail[0].lat, trail[0].lng);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < trail.length; i++) {
    const [px, py] = toXY(trail[i].lat, trail[i].lng);
    ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Start dot (dim)
  ctx.shadowBlur = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(sx, sy, 3, 0, Math.PI * 2);
  ctx.fill();

  // Current position dot (bright + glow)
  const [ex, ey] = toXY(trail[trail.length - 1].lat, trail[trail.length - 1].lng);
  ctx.shadowBlur = 20;
  ctx.shadowColor = accent;
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.arc(ex, ey, 5, 0, Math.PI * 2);
  ctx.fill();

  // Pulse ring
  ctx.shadowBlur = 0;
  ctx.strokeStyle = accent;
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(ex, ey, 10, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ─── Mode / focus ─────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  S.focusIdx = 0;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === `screen-${m}`));
  // Size canvases after they become visible
  if (m === 'run')  { sizeCanvas($('run-canvas'));  drawTrail('run-canvas',  S.runTrail,  '#0ff'); }
  if (m === 'ride') { sizeCanvas($('ride-canvas')); drawTrail('ride-canvas', S.rideTrail, '#f90'); }
  refreshFocus();
}

function focusables() {
  return Array.from(document.querySelectorAll(`#screen-${S.mode} .focusable`));
}

function refreshFocus() {
  document.querySelectorAll('.focusable').forEach(el => el.classList.remove('focused'));
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].classList.add('focused');
}

function activateFocused() {
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].dispatchEvent(new MouseEvent('click'));
}

document.addEventListener('keydown', e => {
  if (S.summaryVisible) {
    if (e.key === 'Enter') closeSummary();
    e.preventDefault();
    return;
  }
  const mi = S.modes.indexOf(S.mode);
  const f = focusables();
  const focused = f[Math.min(S.focusIdx, f.length - 1)];
  const onInterval = focused && focused.id === 'btn-interval' && !S.intervalActive;

  switch (e.key) {
    case 'ArrowLeft':  setMode(S.modes[(mi - 1 + 3) % 3]); break;
    case 'ArrowRight': setMode(S.modes[(mi + 1) % 3]);      break;
    case 'ArrowUp':
      if (onInterval) {
        S.intervalSec = Math.min(1800, S.intervalSec + 30);
        $('btn-interval').textContent = `INTERVAL  ${fmtSec(S.intervalSec)}`;
      } else {
        S.focusIdx = Math.max(0, S.focusIdx - 1);
        refreshFocus();
      }
      break;
    case 'ArrowDown':
      if (onInterval) {
        S.intervalSec = Math.max(30, S.intervalSec - 30);
        $('btn-interval').textContent = `INTERVAL  ${fmtSec(S.intervalSec)}`;
      } else {
        S.focusIdx = Math.min(focusables().length - 1, S.focusIdx + 1);
        refreshFocus();
      }
      break;
    case 'Enter': activateFocused(); break;
  }

  // Update status bar hint contextually
  $('status-bar').children[2].textContent = onInterval ? '↑ ↓ ADJUST' : '↑ ↓ ENTER';

  e.preventDefault();
});

// ─── GPS ─────────────────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) return;
  S.gpsId = navigator.geolocation.watchPosition(onPos, onGPSErr, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 10000,
  });
}

function onPos(pos) {
  $('gps-dot').textContent = 'GPS ●';
  $('gps-dot').classList.add('locked');

  const { latitude: la, longitude: lo, speed, altitude } = pos.coords;

  if (S.lastCoord) {
    const d = haversine(S.lastCoord[0], S.lastCoord[1], la, lo);
    if (S.runActive) {
      S.runDist += d;
      $('run-dist').textContent = S.runDist.toFixed(2);
    }
    if (S.rideActive) {
      S.rideDist += d;
      $('ride-dist').textContent = S.rideDist.toFixed(2);
    }
  }
  S.lastCoord = [la, lo];

  // Append to active trails
  if (S.runActive) {
    S.runTrail.push({ lat: la, lng: lo });
    drawTrail('run-canvas', S.runTrail, '#0ff');
  }
  if (S.rideActive) {
    S.rideTrail.push({ lat: la, lng: lo });
    drawTrail('ride-canvas', S.rideTrail, '#f90');
  }

  if (speed != null && speed > 0.3) {
    const mph = speed * 2.23694;
    if (S.runActive) {
      const mpm = 60 / mph;
      const min = Math.floor(mpm), sec = Math.round((mpm - min) * 60);
      $('run-pace').textContent = `${min}:${String(sec).padStart(2, '0')}`;
    }
    if (S.rideActive) $('ride-speed').textContent = mph.toFixed(1);
  }

  if (altitude != null) {
    if (S.baseAltitude == null) S.baseAltitude = altitude;
    const gain = Math.round((altitude - S.baseAltitude) * 3.28084);
    $('ride-elev').textContent = (gain >= 0 ? '+' : '') + gain;
  }
}

function onGPSErr() {
  $('gps-dot').textContent = 'GPS ✕';
  $('gps-dot').classList.remove('locked');
}

// ─── Run ─────────────────────────────────────────────────────────────────────
$('btn-run').addEventListener('click', () => {
  if (!S.runActive) {
    S.runActive = true;
    S.runStart = Date.now();
    S.runDist = 0;
    S.runTrail = [];
    $('run-dist').textContent = '0.00';
    $('btn-run').textContent = 'STOP RUN';
    drawTrail('run-canvas', S.runTrail, '#0ff');
    S.runTickId = setInterval(() => { $('run-time').textContent = fmt(Date.now() - S.runStart); }, 1000);
  } else {
    S.runActive = false;
    clearInterval(S.runTickId);
    $('btn-run').textContent = 'START RUN';
    $('run-pace').textContent = '--:--';
    const elapsedMs = Date.now() - S.runStart;
    const mpm = S.runDist > 0 ? (elapsedMs / 60000) / S.runDist : 0;
    const paceStr = mpm > 0 ? `${Math.floor(mpm)}:${String(Math.round((mpm % 1) * 60)).padStart(2,'0')}` : '--:--';
    showSummary('#0ff', S.runDist.toFixed(2), 'MILES',
      [[fmt(elapsedMs), 'TIME'], [paceStr, 'AVG PACE']],
      'lc_last_run', { distance: S.runDist, timeMs: elapsedMs, avgPace: paceStr }
    );
  }
});

$('btn-interval').addEventListener('click', () => {
  const banner = $('interval-banner');
  if (S.intervalActive) {
    S.intervalActive = false;
    clearInterval(S.intervalTickId);
    banner.style.display = 'none';
    $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
  } else {
    S.intervalActive = true;
    S.intervalRemain = S.intervalSec;
    banner.style.display = 'block';
    function tick() {
      if (S.intervalRemain <= 0) {
        clearInterval(S.intervalTickId);
        S.intervalActive = false;
        banner.textContent = 'INTERVAL  DONE';
        setTimeout(() => {
          banner.style.display = 'none';
          $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
        }, 2000);
        return;
      }
      banner.textContent = `INTERVAL  ${fmtSec(S.intervalRemain)}`;
      $('btn-interval').textContent = `CANCEL  ${fmtSec(S.intervalRemain)}`;
      S.intervalRemain--;
    }
    tick();
    S.intervalTickId = setInterval(tick, 1000);
  }
});

// ─── Ride ─────────────────────────────────────────────────────────────────────
$('btn-ride').addEventListener('click', () => {
  if (!S.rideActive) {
    S.rideActive = true;
    S.rideStart = Date.now();
    S.rideDist = 0;
    S.rideTrail = [];
    S.baseAltitude = null;
    $('ride-dist').textContent = '0.00';
    $('ride-elev').textContent = '+0';
    $('btn-ride').textContent = 'STOP RIDE';
    drawTrail('ride-canvas', S.rideTrail, '#f90');
  } else {
    S.rideActive = false;
    $('btn-ride').textContent = 'START RIDE';
    $('ride-speed').textContent = '0.0';
    const elapsedMs = Date.now() - S.rideStart;
    const avgSpd = elapsedMs > 0 ? S.rideDist / (elapsedMs / 3600000) : 0;
    const elev = $('ride-elev').textContent;
    showSummary('#f90', S.rideDist.toFixed(2), 'MILES',
      [[fmt(elapsedMs), 'TIME'], [avgSpd.toFixed(1), 'AVG MPH'], [elev, 'FT ELEV']],
      'lc_last_ride', { distance: S.rideDist, timeMs: elapsedMs, avgSpeed: avgSpd }
    );
  }
});

// ─── Gym ─────────────────────────────────────────────────────────────────────
$('btn-rep').addEventListener('click', () => {
  if (!S.gymSetActive) {
    S.gymSetActive = true;
    S.gymSetStart = Date.now();
    S.gymSetTickId = setInterval(() => { $('gym-timer').textContent = fmt(Date.now() - S.gymSetStart); }, 1000);
  }
  S.gymReps++;
  $('gym-reps').textContent = S.gymReps;
});

$('btn-end-set').addEventListener('click', () => {
  if (!S.gymSetActive) return;
  clearInterval(S.gymSetTickId);
  S.gymSetActive = false;
  S.gymSets++;
  $('gym-sets').textContent = S.gymSets;
  S.gymReps = 0;
  $('gym-reps').textContent = 0;
  $('gym-timer').textContent = '0:00';
});

$('btn-rest').addEventListener('click', () => {
  if (S.gymSetActive) {
    clearInterval(S.gymSetTickId);
    S.gymSetActive = false;
    S.gymSets++;
    $('gym-sets').textContent = S.gymSets;
    S.gymReps = 0;
    $('gym-reps').textContent = 0;
  }
  clearInterval(S.gymRestTickId);
  S.gymRestRemain = 90;
  function tick() {
    if (S.gymRestRemain <= 0) {
      clearInterval(S.gymRestTickId);
      $('gym-timer').textContent = 'GO!';
      $('btn-rest').textContent = 'REST 1:30';
      setTimeout(() => { $('gym-timer').textContent = '0:00'; }, 2500);
      return;
    }
    $('gym-timer').textContent = fmtSec(S.gymRestRemain);
    $('btn-rest').textContent = `REST  ${fmtSec(S.gymRestRemain)}`;
    S.gymRestRemain--;
  }
  tick();
  S.gymRestTickId = setInterval(tick, 1000);
});

// ─── Clock ───────────────────────────────────────────────────────────────────
function updateClock() {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(updateClock, 30000);
updateClock();

// ─── Init ────────────────────────────────────────────────────────────────────
setMode('run');
startGPS();
</script>
</body>
</html>
