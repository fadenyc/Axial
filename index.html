<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>LiveCoach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Rajdhani', 'Courier New', monospace;
      font-size: 16px;
      user-select: none;
    }

    /* ── Faint grid background ──────────────────────────── */
    #app {
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image:
        linear-gradient(rgba(0,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Top bar ────────────────────────────────────────── */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
      position: relative;
    }

    #gps-dot {
      font-size: 12px;
      letter-spacing: 2px;
      color: #333;
      font-weight: 600;
    }
    #gps-dot.locked { color: #0f0; text-shadow: 0 0 8px #0f0; }

    #mode-bar {
      display: flex;
      gap: 32px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .mode-tab {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #2a2a2a;
      transition: color 0.2s;
    }

    .mode-tab.active {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent);
    }

    #clock {
      font-size: 13px;
      letter-spacing: 2px;
      color: #333;
      font-weight: 600;
    }

    /* ── Screens ────────────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 0 20px 0;
      overflow: hidden;
      --accent: #0ff;
    }

    .screen.active { display: flex; }

    #screen-run  { --accent: #0ff; }
    #screen-ride { --accent: #f90; }
    #screen-gym  { --accent: #c084fc; }

    /* ── Hero metric ────────────────────────────────────── */
    .hero-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 5px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .hero-value {
      font-size: 120px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px var(--accent), 0 0 80px color-mix(in srgb, var(--accent) 30%, transparent);
      letter-spacing: -2px;
    }

    .hero-unit {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #444;
      margin-top: 4px;
    }

    /* Scan line under hero */
    .hero-wrap::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -20px;
      right: -20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
    }

    /* ── HUD corner brackets ────────────────────────────── */
    .bracket {
      position: relative;
    }

    .bracket::before,
    .bracket::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.5;
    }

    .bracket::before {
      top: 0; left: 0;
      border-width: 1px 0 0 1px;
    }

    .bracket::after {
      bottom: 0; right: 0;
      border-width: 0 1px 1px 0;
    }

    /* ── Stat strip ─────────────────────────────────────── */
    .stat-strip {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }

    .stat-cell {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 8px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #444;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Heart rate placeholder */
    .stat-cell.hr .stat-value { color: #555; }
    .stat-cell.hr .stat-label { color: #2a2a2a; }

    /* ── Interval banner ────────────────────────────────── */
    #interval-banner {
      display: none;
      background: #0f0;
      color: #000;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 5px 0;
      margin-bottom: 6px;
      text-shadow: none;
    }

    /* ── Controls ───────────────────────────────────────── */
    .ctrl-row {
      display: flex;
      gap: 8px;
      padding-bottom: 10px;
    }

    .focusable {
      min-height: 88px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #333;
      background: rgba(255,255,255,0.02);
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
    }

    .focusable.focused {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 20%, transparent),
                  inset 0 0 16px color-mix(in srgb, var(--accent) 5%, transparent);
    }

    /* ── Status bar ─────────────────────────────────────── */
    #status-bar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
      font-weight: 600;
      color: #252525;
      letter-spacing: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="top-bar">
    <span id="gps-dot">GPS --</span>
    <div id="mode-bar">
      <span class="mode-tab" data-mode="run">RUN</span>
      <span class="mode-tab" data-mode="ride">RIDE</span>
      <span class="mode-tab" data-mode="gym">GYM</span>
    </div>
    <span id="clock">--:--</span>
  </div>

  <!-- ── RUN ──────────────────────────────────────────── -->
  <div class="screen" id="screen-run">

    <div class="hero-wrap bracket">
      <div class="hero-label">PACE</div>
      <div class="hero-value" id="run-pace">--:--</div>
      <div class="hero-unit">/ MILE</div>
    </div>

    <div id="interval-banner">INTERVAL &nbsp; 0:00</div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="run-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="run-time">0:00</div>
        <div class="stat-label">TIME</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-run">START RUN</button>
    </div>
    <div class="ctrl-row">
      <button class="focusable" id="btn-interval">INTERVAL 1:00</button>
    </div>

  </div>

  <!-- ── RIDE ─────────────────────────────────────────── -->
  <div class="screen" id="screen-ride">

    <div class="hero-wrap bracket">
      <div class="hero-label">SPEED</div>
      <div class="hero-value" id="ride-speed">0.0</div>
      <div class="hero-unit">MPH</div>
    </div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="ride-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="ride-elev">+0</div>
        <div class="stat-label">FT ELEV</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-ride">START RIDE</button>
    </div>

  </div>

  <!-- ── GYM ──────────────────────────────────────────── -->
  <div class="screen" id="screen-gym">

    <div class="hero-wrap bracket">
      <div class="hero-label">SET TIMER</div>
      <div class="hero-value" id="gym-timer">0:00</div>
      <div class="hero-unit">&nbsp;</div>
    </div>

    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-value" id="gym-reps">0</div>
        <div class="stat-label">REPS</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="gym-sets">0</div>
        <div class="stat-label">SETS</div>
      </div>
      <div class="stat-cell hr">
        <div class="stat-value">-- BPM</div>
        <div class="stat-label">HR</div>
      </div>
    </div>

    <div class="ctrl-row">
      <button class="focusable" id="btn-rep">+ REP</button>
      <button class="focusable" id="btn-end-set">END SET</button>
    </div>
    <div class="ctrl-row">
      <button class="focusable" id="btn-rest">REST 1:30</button>
    </div>

  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span>← → MODE</span>
    <span>LIVECOACH</span>
    <span>↑ ↓ ENTER</span>
  </div>

</div>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  mode: 'run',
  modes: ['run', 'ride', 'gym'],

  gpsId: null,
  lastCoord: null,
  baseAltitude: null,

  runActive: false,
  runStart: 0,
  runDist: 0,
  runTickId: null,
  intervalActive: false,
  intervalSec: 60,
  intervalRemain: 0,
  intervalTickId: null,

  rideActive: false,
  rideDist: 0,

  gymSetActive: false,
  gymSetStart: 0,
  gymSetTickId: null,
  gymReps: 0,
  gymSets: 0,
  gymRestTickId: null,
  gymRestRemain: 0,

  focusIdx: 0,
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function fmtSec(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function haversine(la1, lo1, la2, lo2) {
  const R = 3958.8, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─── Mode / focus ─────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  S.focusIdx = 0;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === `screen-${m}`));
  refreshFocus();
}

function focusables() {
  return Array.from(document.querySelectorAll(`#screen-${S.mode} .focusable`));
}

function refreshFocus() {
  document.querySelectorAll('.focusable').forEach(el => el.classList.remove('focused'));
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].classList.add('focused');
}

function activateFocused() {
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].dispatchEvent(new MouseEvent('click'));
}

document.addEventListener('keydown', e => {
  const mi = S.modes.indexOf(S.mode);
  switch (e.key) {
    case 'ArrowLeft':  setMode(S.modes[(mi - 1 + 3) % 3]); break;
    case 'ArrowRight': setMode(S.modes[(mi + 1) % 3]);      break;
    case 'ArrowUp':    S.focusIdx = Math.max(0, S.focusIdx - 1); refreshFocus(); break;
    case 'ArrowDown':  S.focusIdx = Math.min(focusables().length - 1, S.focusIdx + 1); refreshFocus(); break;
    case 'Enter':      activateFocused(); break;
  }
  e.preventDefault();
});

// ─── GPS ─────────────────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) return;
  S.gpsId = navigator.geolocation.watchPosition(onPos, onGPSErr, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 10000,
  });
}

function onPos(pos) {
  const gpsDot = $('gps-dot');
  gpsDot.textContent = 'GPS ●';
  gpsDot.classList.add('locked');

  const { latitude: la, longitude: lo, speed, altitude } = pos.coords;

  if (S.lastCoord) {
    const d = haversine(S.lastCoord[0], S.lastCoord[1], la, lo);
    if (S.runActive)  { S.runDist  += d; $('run-dist').textContent  = S.runDist.toFixed(2); }
    if (S.rideActive) { S.rideDist += d; $('ride-dist').textContent = S.rideDist.toFixed(2); }
  }
  S.lastCoord = [la, lo];

  if (speed != null && speed > 0.3) {
    const mph = speed * 2.23694;
    if (S.runActive) {
      const mpm = 60 / mph;
      const min = Math.floor(mpm), sec = Math.round((mpm - min) * 60);
      $('run-pace').textContent = `${min}:${String(sec).padStart(2, '0')}`;
    }
    if (S.rideActive) $('ride-speed').textContent = mph.toFixed(1);
  }

  if (altitude != null) {
    if (S.baseAltitude == null) S.baseAltitude = altitude;
    const gain = Math.round((altitude - S.baseAltitude) * 3.28084);
    $('ride-elev').textContent = (gain >= 0 ? '+' : '') + gain;
  }
}

function onGPSErr() {
  const gpsDot = $('gps-dot');
  gpsDot.textContent = 'GPS ✕';
  gpsDot.classList.remove('locked');
}

// ─── Run ─────────────────────────────────────────────────────────────────────
$('btn-run').addEventListener('click', () => {
  if (!S.runActive) {
    S.runActive = true;
    S.runStart = Date.now();
    S.runDist = 0;
    $('run-dist').textContent = '0.00';
    $('btn-run').textContent = 'STOP RUN';
    S.runTickId = setInterval(() => { $('run-time').textContent = fmt(Date.now() - S.runStart); }, 1000);
  } else {
    S.runActive = false;
    clearInterval(S.runTickId);
    $('btn-run').textContent = 'START RUN';
    $('run-pace').textContent = '--:--';
  }
});

$('btn-interval').addEventListener('click', () => {
  const banner = $('interval-banner');
  if (S.intervalActive) {
    S.intervalActive = false;
    clearInterval(S.intervalTickId);
    banner.style.display = 'none';
    $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
  } else {
    S.intervalActive = true;
    S.intervalRemain = S.intervalSec;
    banner.style.display = 'block';
    function tick() {
      if (S.intervalRemain <= 0) {
        clearInterval(S.intervalTickId);
        S.intervalActive = false;
        banner.textContent = 'INTERVAL  DONE';
        setTimeout(() => {
          banner.style.display = 'none';
          $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
        }, 2000);
        return;
      }
      banner.textContent = `INTERVAL  ${fmtSec(S.intervalRemain)}`;
      $('btn-interval').textContent = `CANCEL  ${fmtSec(S.intervalRemain)}`;
      S.intervalRemain--;
    }
    tick();
    S.intervalTickId = setInterval(tick, 1000);
  }
});

// ─── Ride ─────────────────────────────────────────────────────────────────────
$('btn-ride').addEventListener('click', () => {
  if (!S.rideActive) {
    S.rideActive = true;
    S.rideDist = 0;
    S.baseAltitude = null;
    $('ride-dist').textContent = '0.00';
    $('ride-elev').textContent = '+0';
    $('btn-ride').textContent = 'STOP RIDE';
  } else {
    S.rideActive = false;
    $('btn-ride').textContent = 'START RIDE';
    $('ride-speed').textContent = '0.0';
  }
});

// ─── Gym ─────────────────────────────────────────────────────────────────────
$('btn-rep').addEventListener('click', () => {
  if (!S.gymSetActive) {
    S.gymSetActive = true;
    S.gymSetStart = Date.now();
    S.gymSetTickId = setInterval(() => { $('gym-timer').textContent = fmt(Date.now() - S.gymSetStart); }, 1000);
  }
  S.gymReps++;
  $('gym-reps').textContent = S.gymReps;
});

$('btn-end-set').addEventListener('click', () => {
  if (!S.gymSetActive) return;
  clearInterval(S.gymSetTickId);
  S.gymSetActive = false;
  S.gymSets++;
  $('gym-sets').textContent = S.gymSets;
  S.gymReps = 0;
  $('gym-reps').textContent = 0;
  $('gym-timer').textContent = '0:00';
});

$('btn-rest').addEventListener('click', () => {
  if (S.gymSetActive) {
    clearInterval(S.gymSetTickId);
    S.gymSetActive = false;
    S.gymSets++;
    $('gym-sets').textContent = S.gymSets;
    S.gymReps = 0;
    $('gym-reps').textContent = 0;
  }
  clearInterval(S.gymRestTickId);
  S.gymRestRemain = 90;
  function tick() {
    if (S.gymRestRemain <= 0) {
      clearInterval(S.gymRestTickId);
      $('gym-timer').textContent = 'GO!';
      $('btn-rest').textContent = 'REST 1:30';
      setTimeout(() => { $('gym-timer').textContent = '0:00'; }, 2500);
      return;
    }
    $('gym-timer').textContent = fmtSec(S.gymRestRemain);
    $('btn-rest').textContent = `REST  ${fmtSec(S.gymRestRemain)}`;
    S.gymRestRemain--;
  }
  tick();
  S.gymRestTickId = setInterval(tick, 1000);
});

// ─── Clock ───────────────────────────────────────────────────────────────────
function updateClock() {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(updateClock, 30000);
updateClock();

// ─── Init ────────────────────────────────────────────────────────────────────
setMode('run');
startGPS();
</script>
</body>
</html>
