<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, user-scalable=no">
  <title>LiveCoach</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      user-select: none;
    }

    #app {
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Mode bar ─────────────────────────────────────────── */
    #mode-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 48px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .mode-tab {
      font-size: 16px;
      letter-spacing: 3px;
      color: #444;
      transition: color 0.15s;
    }

    .mode-tab.active { color: #0ff; }

    /* ── GPS badge ────────────────────────────────────────── */
    #gps-dot {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #444;
    }

    #gps-dot.locked { color: #0f0; }

    /* ── Screens ──────────────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 16px 20px 8px;
      overflow: hidden;
    }

    .screen.active { display: flex; }

    /* ── Metric blocks ────────────────────────────────────── */
    .metric-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: #555;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metric-hero {
      font-size: 88px;
      font-weight: bold;
      color: #0ff;
      text-align: center;
      line-height: 1;
    }

    .metric-unit {
      font-size: 14px;
      color: #444;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    hr.div {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 10px 0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-cell {
      border: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }

    .stat-value {
      font-size: 36px;
      color: #fff;
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Focusable controls ───────────────────────────────── */
    .focusable {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 20px;
      letter-spacing: 2px;
      color: #fff;
      background: transparent;
      border: 2px solid #2a2a2a;
      border-radius: 2px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }

    .focusable.focused {
      border-color: #0f0;
      color: #0f0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row .focusable { flex: 1; }

    /* ── Interval banner ──────────────────────────────────── */
    #interval-banner {
      display: none;
      background: #0f0;
      color: #000;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      padding: 6px 0;
      margin-bottom: 6px;
    }

    /* ── Status bar ───────────────────────────────────────── */
    #status-bar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid #1a1a1a;
      font-size: 12px;
      color: #333;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="app">

  <span id="gps-dot">GPS --</span>

  <!-- Mode bar -->
  <div id="mode-bar">
    <span class="mode-tab" data-mode="run">RUN</span>
    <span class="mode-tab" data-mode="ride">RIDE</span>
    <span class="mode-tab" data-mode="gym">GYM</span>
  </div>

  <!-- ── RUN ────────────────────────────────────────────── -->
  <div class="screen" id="screen-run">
    <div class="metric-label">PACE</div>
    <div class="metric-hero" id="run-pace">--:--</div>
    <div class="metric-unit">/ MILE</div>

    <div id="interval-banner" id="interval-display">INTERVAL &nbsp; 0:00</div>

    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-value" id="run-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="run-time">0:00</div>
        <div class="stat-label">ELAPSED</div>
      </div>
    </div>

    <div class="btn-row" style="margin-bottom:8px;">
      <button class="focusable" id="btn-run">START RUN</button>
    </div>
    <div class="btn-row">
      <button class="focusable" id="btn-interval">INTERVAL 1:00</button>
    </div>
  </div>

  <!-- ── RIDE ───────────────────────────────────────────── -->
  <div class="screen" id="screen-ride">
    <div class="metric-label">SPEED</div>
    <div class="metric-hero" id="ride-speed">0.0</div>
    <div class="metric-unit">MPH</div>

    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-value" id="ride-dist">0.00</div>
        <div class="stat-label">MI</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="ride-elev">---</div>
        <div class="stat-label">FT ELEV</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="focusable" id="btn-ride">START RIDE</button>
    </div>
  </div>

  <!-- ── GYM ────────────────────────────────────────────── -->
  <div class="screen" id="screen-gym">
    <div class="metric-label">SET TIMER</div>
    <div class="metric-hero" id="gym-timer">0:00</div>
    <div class="metric-unit">&nbsp;</div>

    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-value" id="gym-reps">0</div>
        <div class="stat-label">REPS</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value" id="gym-sets">0</div>
        <div class="stat-label">SETS</div>
      </div>
    </div>

    <div class="btn-row" style="margin-bottom:8px;">
      <button class="focusable" id="btn-rep">+ REP</button>
      <button class="focusable" id="btn-end-set">END SET</button>
    </div>
    <div class="btn-row">
      <button class="focusable" id="btn-rest">REST 1:30</button>
    </div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span>← → MODE</span>
    <span id="clock">--:--</span>
    <span>↑ ↓ ENTER</span>
  </div>

</div>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  mode: 'run',
  modes: ['run', 'ride', 'gym'],

  // GPS
  gpsId: null,
  lastCoord: null,
  baseAltitude: null,

  // Run
  runActive: false,
  runStart: 0,
  runDist: 0,          // miles
  runTickId: null,
  intervalActive: false,
  intervalSec: 60,
  intervalRemain: 0,
  intervalTickId: null,

  // Ride
  rideActive: false,
  rideDist: 0,

  // Gym
  gymSetActive: false,
  gymSetStart: 0,
  gymSetTickId: null,
  gymReps: 0,
  gymSets: 0,
  gymRestTickId: null,
  gymRestRemain: 0,

  // Focus
  focusIdx: 0,
};

// ─── DOM refs ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const gpsDot        = $('gps-dot');
const modeTabs      = document.querySelectorAll('.mode-tab');
const screens       = document.querySelectorAll('.screen');
const clockEl       = $('clock');
const intervalBanner = $('interval-banner');

// ─── Utilities ───────────────────────────────────────────────────────────────
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function fmtSec(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// Haversine — returns miles
function haversine(la1, lo1, la2, lo2) {
  const R = 3958.8, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─── Mode / focus ────────────────────────────────────────────────────────────
function setMode(m) {
  S.mode = m;
  S.focusIdx = 0;
  modeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  screens.forEach(s => s.classList.toggle('active', s.id === `screen-${m}`));
  refreshFocus();
}

function focusables() {
  return Array.from(document.querySelectorAll(`#screen-${S.mode} .focusable`));
}

function refreshFocus() {
  document.querySelectorAll('.focusable').forEach(el => el.classList.remove('focused'));
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].classList.add('focused');
}

function activateFocused() {
  const f = focusables();
  if (f.length) f[Math.min(S.focusIdx, f.length - 1)].dispatchEvent(new MouseEvent('click'));
}

document.addEventListener('keydown', e => {
  const mi = S.modes.indexOf(S.mode);
  switch (e.key) {
    case 'ArrowLeft':  setMode(S.modes[(mi - 1 + 3) % 3]); break;
    case 'ArrowRight': setMode(S.modes[(mi + 1) % 3]);      break;
    case 'ArrowUp':    S.focusIdx = Math.max(0, S.focusIdx - 1); refreshFocus(); break;
    case 'ArrowDown':  S.focusIdx = Math.min(focusables().length - 1, S.focusIdx + 1); refreshFocus(); break;
    case 'Enter':      activateFocused(); break;
  }
  e.preventDefault();
});

// ─── GPS ─────────────────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) return;
  S.gpsId = navigator.geolocation.watchPosition(onPos, onGPSErr, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 10000,
  });
}

function onPos(pos) {
  gpsDot.textContent = 'GPS ●';
  gpsDot.classList.add('locked');

  const { latitude: la, longitude: lo, speed, altitude } = pos.coords;

  if (S.lastCoord) {
    const d = haversine(S.lastCoord[0], S.lastCoord[1], la, lo);
    if (S.runActive)  { S.runDist  += d; $('run-dist').textContent  = S.runDist.toFixed(2); }
    if (S.rideActive) { S.rideDist += d; $('ride-dist').textContent = S.rideDist.toFixed(2); }
  }
  S.lastCoord = [la, lo];

  // Speed → pace / mph
  if (speed != null && speed > 0.3) {
    const mph = speed * 2.23694;

    if (S.runActive) {
      const mpm = 60 / mph;
      const min = Math.floor(mpm), sec = Math.round((mpm - min) * 60);
      $('run-pace').textContent = `${min}:${String(sec).padStart(2, '0')}`;
    }

    if (S.rideActive) {
      $('ride-speed').textContent = mph.toFixed(1);
    }
  }

  // Elevation — show gain from session start
  if (altitude != null) {
    if (S.baseAltitude == null) S.baseAltitude = altitude;
    const gain = Math.round((altitude - S.baseAltitude) * 3.28084);
    $('ride-elev').textContent = (gain >= 0 ? '+' : '') + gain;
  }
}

function onGPSErr() {
  gpsDot.textContent = 'GPS ✕';
  gpsDot.classList.remove('locked');
}

// ─── Run ─────────────────────────────────────────────────────────────────────
$('btn-run').addEventListener('click', () => {
  if (!S.runActive) {
    S.runActive = true;
    S.runStart = Date.now();
    S.runDist = 0;
    $('run-dist').textContent = '0.00';
    $('btn-run').textContent = 'STOP RUN';
    S.runTickId = setInterval(() => {
      $('run-time').textContent = fmt(Date.now() - S.runStart);
    }, 1000);
  } else {
    S.runActive = false;
    clearInterval(S.runTickId);
    $('btn-run').textContent = 'START RUN';
    $('run-pace').textContent = '--:--';
  }
});

$('btn-interval').addEventListener('click', () => {
  if (S.intervalActive) {
    // Cancel
    S.intervalActive = false;
    clearInterval(S.intervalTickId);
    intervalBanner.style.display = 'none';
    $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
  } else {
    S.intervalActive = true;
    S.intervalRemain = S.intervalSec;
    intervalBanner.style.display = 'block';

    function tick() {
      if (S.intervalRemain <= 0) {
        clearInterval(S.intervalTickId);
        S.intervalActive = false;
        intervalBanner.textContent = 'INTERVAL  DONE';
        setTimeout(() => {
          intervalBanner.style.display = 'none';
          $('btn-interval').textContent = `INTERVAL ${fmtSec(S.intervalSec)}`;
        }, 2000);
        return;
      }
      intervalBanner.textContent = `INTERVAL  ${fmtSec(S.intervalRemain)}`;
      $('btn-interval').textContent = `CANCEL  ${fmtSec(S.intervalRemain)}`;
      S.intervalRemain--;
    }
    tick();
    S.intervalTickId = setInterval(tick, 1000);
  }
});

// ─── Ride ────────────────────────────────────────────────────────────────────
$('btn-ride').addEventListener('click', () => {
  if (!S.rideActive) {
    S.rideActive = true;
    S.rideDist = 0;
    S.baseAltitude = null;
    $('ride-dist').textContent = '0.00';
    $('ride-elev').textContent = '+0';
    $('btn-ride').textContent = 'STOP RIDE';
  } else {
    S.rideActive = false;
    $('btn-ride').textContent = 'START RIDE';
    $('ride-speed').textContent = '0.0';
  }
});

// ─── Gym ─────────────────────────────────────────────────────────────────────
$('btn-rep').addEventListener('click', () => {
  if (!S.gymSetActive) {
    // Start the set timer on first rep
    S.gymSetActive = true;
    S.gymSetStart = Date.now();
    S.gymSetTickId = setInterval(() => {
      $('gym-timer').textContent = fmt(Date.now() - S.gymSetStart);
    }, 1000);
  }
  S.gymReps++;
  $('gym-reps').textContent = S.gymReps;
});

$('btn-end-set').addEventListener('click', () => {
  if (!S.gymSetActive) return;
  clearInterval(S.gymSetTickId);
  S.gymSetActive = false;
  S.gymSets++;
  $('gym-sets').textContent = S.gymSets;
  S.gymReps = 0;
  $('gym-reps').textContent = 0;
  $('gym-timer').textContent = '0:00';
});

$('btn-rest').addEventListener('click', () => {
  // End any active set first
  if (S.gymSetActive) {
    clearInterval(S.gymSetTickId);
    S.gymSetActive = false;
    S.gymSets++;
    $('gym-sets').textContent = S.gymSets;
    S.gymReps = 0;
    $('gym-reps').textContent = 0;
  }

  clearInterval(S.gymRestTickId);
  S.gymRestRemain = 90;

  function tick() {
    if (S.gymRestRemain <= 0) {
      clearInterval(S.gymRestTickId);
      $('gym-timer').textContent = 'GO!';
      $('btn-rest').textContent = 'REST 1:30';
      setTimeout(() => { $('gym-timer').textContent = '0:00'; }, 2500);
      return;
    }
    $('gym-timer').textContent = fmtSec(S.gymRestRemain);
    $('btn-rest').textContent = `REST  ${fmtSec(S.gymRestRemain)}`;
    S.gymRestRemain--;
  }
  tick();
  S.gymRestTickId = setInterval(tick, 1000);
});

// ─── Clock ───────────────────────────────────────────────────────────────────
function updateClock() {
  const d = new Date();
  clockEl.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(updateClock, 30000);
updateClock();

// ─── Init ────────────────────────────────────────────────────────────────────
setMode('run');
startGPS();
</script>
</body>
</html>
